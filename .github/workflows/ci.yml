name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FAT tooling for filesystem tests
        # mkfs.vfat + mtools let the FAT32 recovery test build a real image.
        # exFAT tests need loopback + FUSE and skip automatically on CI.
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          # Optional: enables the HEIC and decode-verification tests.
          pip install pillow pillow-heif || true

      - name: Run tests
        run: pytest -q
